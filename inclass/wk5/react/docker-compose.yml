# Alternative way to run the wk5 React workshop for anyone stuck on a local
# Vite/Node install -- see DOCKER.md. The main path is still README.md
# (npm ci / npm run dev); this is only for students who can't get that working.
#
#   docker compose watch     starts the dev server at http://localhost:5173, edits sync in
#   docker compose down      stop
#
# Only runs the drills (npm run dev). It does not run the automated checks in
# tests/ -- those still need a local Node install, same as before.

services:
  react:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: itws2110-wk5-react-dev
    ports:
      - "${VITE_PORT:-5173}:5173"
    develop:
      watch:
        # Everything you actually edit for the drills.
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./index.html
          target: /app/index.html
        - action: sync
          path: ./00-micro.html
          target: /app/00-micro.html
        # Config Vite doesn't hot-reload on its own -- restart the dev server.
        - action: sync+restart
          path: ./vite.config.js
          target: /app/vite.config.js
        - action: sync+restart
          path: ./jsconfig.json
          target: /app/jsconfig.json
        - action: sync+restart
          path: ./components.json
          target: /app/components.json
        # A new dependency needs `npm ci` again, not just a file copy.
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./Dockerfile.dev
