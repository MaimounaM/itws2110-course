# The week 7 workshop. One image (see Dockerfile), three ways to run it.
#
#   docker compose watch                 the app, at http://localhost:8000 -- edits sync in
#   docker compose run --rm test         every drill check, in the terminal
#   docker compose down                  stop
#
# The drills page also runs one drill's check when you click its Check result button.
# Edits to app/, routes/, resources/ and tests/ show up without a rebuild: PHP reads
# the files again on every request, so the next page load sees your change.

name: itws2110-wk7

x-source: &source
  - ./app:/app/app
  - ./routes:/app/routes
  - ./resources:/app/resources
  - ./tests:/app/tests

services:
  # The app. Long-running, so it is started with `docker compose watch`: save a file
  # under app/, routes/ or resources/ and Compose copies it into the container
  # ("Syncing"). Change composer.json or the Dockerfile and it rebuilds instead.
  app:
    build: .
    image: itws2110-wk7-laravel
    ports:
      - "${APP_PORT:-8000}:8000"
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
        - action: sync
          path: ./routes
          target: /app/routes
        - action: sync
          path: ./resources
          target: /app/resources
        - action: sync
          path: ./tests
          target: /app/tests
        - action: sync
          path: ./answers
          target: /app/answers
        - action: rebuild
          path: ./composer.json
        - action: rebuild
          path: ./composer.lock
        - action: rebuild
          path: ./Dockerfile

  # Every drill check at once, in the terminal. One-shot: it runs and exits.
  # It bind-mounts your source, so it always sees your latest save.
  # `profiles: [test]` keeps `docker compose watch` from starting it.
  test:
    image: itws2110-wk7-laravel
    build: .
    profiles: [test]
    volumes: *source
    command: php artisan test

  # For instructors: the same checks against the worked answers in answers/, on a
  # throwaway copy. All nine should pass. `docker compose run --rm answers`
  answers:
    image: itws2110-wk7-laravel
    build: .
    profiles: [instructor]
    volumes:
      - ./app:/src/app:ro
      - ./routes:/src/routes:ro
      - ./resources:/src/resources:ro
      - ./tests:/src/tests:ro
      - ./answers:/src/answers:ro
    command: >
      sh -c "cp -R /src/app /src/routes /src/resources /src/tests /app/ &&
             cp -R /src/answers/. /app/ && php artisan test"
