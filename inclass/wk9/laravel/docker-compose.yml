# The week 9 workshop. One image (see Dockerfile), a MySQL database, three ways to run it.
#
#   docker compose watch                 the app, at http://localhost:8000 -- edits sync in
#   docker compose run --rm test         every drill check, in the terminal
#   docker compose down                  stop          (add -v to throw the database away)
#
# After you change a migration, rebuild the tables and seed them again:
#
#   docker compose exec app php artisan migrate:fresh --seed

name: itws2110-wk9

x-source: &source
  - ./app:/app/app
  - ./routes:/app/routes
  - ./resources:/app/resources
  - ./database:/app/database
  - ./tests:/app/tests

services:
  # The app. It waits for MySQL to be ready (service_healthy, not just started), builds
  # the tables, seeds them, and serves. Save a file and Compose copies it in ("Syncing").
  app:
    build: .
    image: itws2110-wk9-laravel
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
        - action: sync
          path: ./routes
          target: /app/routes
        - action: sync
          path: ./resources
          target: /app/resources
        - action: sync
          path: ./database
          target: /app/database
        - action: sync
          path: ./tests
          target: /app/tests
        - action: sync
          path: ./answers
          target: /app/answers
        - action: rebuild
          path: ./composer.json
        - action: rebuild
          path: ./composer.lock
        - action: rebuild
          path: ./Dockerfile

  # MySQL. The app reaches it by its service name: DB_HOST=db in .env.example. It
  # publishes no ports, because only the app needs it. Its files are in a named volume.
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pantry
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Every drill check at once, in the terminal. One-shot: it runs and exits. The checks
  # use an in-memory SQLite database (phpunit.xml), so this does not need MySQL running.
  test:
    image: itws2110-wk9-laravel
    build: .
    profiles: [test]
    volumes: *source
    command: php artisan test

  # For instructors: the same checks against the worked answers in answers/, on a
  # throwaway copy. All twelve should pass. `docker compose run --rm answers`
  answers:
    image: itws2110-wk9-laravel
    build: .
    profiles: [instructor]
    volumes:
      - ./app:/src/app:ro
      - ./routes:/src/routes:ro
      - ./resources:/src/resources:ro
      - ./database:/src/database:ro
      - ./tests:/src/tests:ro
      - ./answers:/src/answers:ro
    command: >
      sh -c "cp -R /src/app /src/routes /src/resources /src/database /src/tests /app/ &&
             cp -R /src/answers/. /app/ && php artisan test"

volumes:
  dbdata:
